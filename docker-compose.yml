# Local development only. Production Postgres is a Coolify-managed service.
services:
  db:
    image: postgres:17-alpine
    container_name: eats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eats
      POSTGRES_PASSWORD: eats
      POSTGRES_DB: eats
    ports:
      - '5432:5432'
    volumes:
      - eats-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eats -d eats']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eats-pgdata:
